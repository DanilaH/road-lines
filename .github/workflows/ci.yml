name: App and kit checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  kit-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tools/browser-smoke.mjs --production
      - run: node tools/ux-smoke.mjs --run
      - run: node tools/balance-smoke.mjs
  mobile-flows:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flow: [persistence, localization, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.flow }} scenarios
        run: |
          ulimit -c 0
          node tools/${{ matrix.flow }}-smoke.mjs --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-lines-${{ matrix.flow }}-evidence
          path: |
            .test-output/persistence/results.json
            .test-output/localization/results.json
            .test-output/localization/failure.png
          if-no-files-found: ignore
