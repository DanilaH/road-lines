name: Android debug build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run check
      - uses: actions/cache@v4
        with:
          path: .test-output/android-signing/debug.keystore
          key: road-lines-playtest-debug-keystore-v2
      - run: npm run android:build
        env:
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_DEBUG_API_KEY }}
          ROAD_LINES_PLAYTEST: 'true'
          ROAD_LINES_AD_MODE: 'demo'
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: road-lines-playtest-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
