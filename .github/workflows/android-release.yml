name: Android release candidate
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/android/**'
      - 'tools/android*'
      - 'tools/check-android-release.mjs'
      - 'tools/verify-release.py'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-candidate
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run check
      - name: Build signed release
        run: npm run android:release
        env:
          ROAD_LINES_AD_MODE: 'live'
          ROAD_LINES_PLAYTEST: 'false'
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify signed APK and production payload
        run: python3 tools/verify-release.py
        env:
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: road-lines-release-candidate
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            .test-output/release-verification.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Clean ephemeral signing file
        if: always()
        run: python3 -c "from pathlib import Path; Path('.test-output/android-signing/release.jks').unlink(missing_ok=True)"
